<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 478' width='760' height='478' role='img' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'><title>CPU usage by JVM component at steady state</title><rect width='760' height='478' rx='8' fill='#fcfcfb'/><text x='24.0' y='26.0' font-size='15' fill='#0b0b0b' text-anchor='start' font-weight='600'>CPU usage by JVM component at steady state</text><text x='24.0' y='46.0' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>pidstat, per thread. 100% = one CPU; the container has two (the hardware threads of one core). Median of 3 runs.</text><rect x='24.0' y='57' width='10' height='10' rx='2' fill='#2a78d6'/><text x='40.0' y='66.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>JDK 25, G1, 512 MB</text><rect x='174.8' y='57' width='10' height='10' rx='2' fill='#eb6834'/><text x='190.8' y='66.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>JDK 27 + AOT cache</text><rect x='325.6' y='57' width='10' height='10' rx='2' fill='#1baf7a'/><text x='341.6' y='66.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>JDK 27 + trained AOT cache</text><text x='218.0' y='116.0' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>Whole process</text><rect x='230' y='84' width='410.0' height='16' rx='3' fill='#2a78d6'><title>JDK 25, G1, 512 MB: 115%</title></rect><text x='646.0' y='96.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>115%</text><rect x='230' y='104' width='306.1' height='16' rx='3' fill='#eb6834'><title>JDK 27 + AOT cache: 86%</title></rect><text x='542.1' y='116.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>86%  (-25%)</text><rect x='230' y='124' width='306.9' height='16' rx='3' fill='#1baf7a'><title>JDK 27 + trained AOT cache: 86%</title></rect><text x='542.9' y='136.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>86%  (-25%)</text><te