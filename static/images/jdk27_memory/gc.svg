<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 322' width='760' height='322' role='img' font-family='-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif'><title>Garbage collection at steady state</title><rect width='760' height='322' rx='8' fill='#fcfcfb'/><text x='24.0' y='26.0' font-size='15' fill='#0b0b0b' text-anchor='start' font-weight='600'>Garbage collection at steady state</text><text x='24.0' y='46.0' font-size='12' fill='#52514e' text-anchor='start' font-weight='400'>G1 with 512 MB vs ParallelGC with 384 MB. Median of 3 runs.</text><rect x='24.0' y='57' width='10' height='10' rx='2' fill='#2a78d6'/><text x='40.0' y='66.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>JDK 25, G1, 512 MB</text><rect x='174.8' y='57' width='10' height='10' rx='2' fill='#eb6834'/><text x='190.8' y='66.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>JDK 27 + AOT cache</text><rect x='325.6' y='57' width='10' height='10' rx='2' fill='#1baf7a'/><text x='341.6' y='66.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>JDK 27 + trained AOT cache</text><text x='218.0' y='116.0' font-size='13' fill='#0b0b0b' text-anchor='end' font-weight='400'>Total pause time</text><rect x='230' y='84' width='410.0' height='16' rx='3' fill='#2a78d6'><title>JDK 25, G1, 512 MB: 26.8 s</title></rect><text x='646.0' y='96.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>26.8 s</text><rect x='230' y='104' width='290.6' height='16' rx='3' fill='#eb6834'><title>JDK 27 + AOT cache: 19.0 s</title></rect><text x='526.6' y='116.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>19.0 s  (-29%)</text><rect x='230' y='124' width='299.8' height='16' rx='3' fill='#1baf7a'><title>JDK 27 + trained AOT cache: 19.6 s</title></rect><text x='535.8' y='136.0' font-size='12' fill='#0b0b0b' text-anchor='start' font-weight='400'>19.6 s  (-27%)</text><text x='218.0' y='194.0' font-size='13' fill='#0b0b0